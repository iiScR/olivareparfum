<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4D03F"/>
      <stop offset="100%" stop-color="#B7950B"/>
    </linearGradient>
  </defs>
  <!-- Stylized É mark -->
  <g transform="translate(0, 8)">
    <rect x="2" y="0" width="6" height="52" rx="1" fill="url(#gold)"/>
    <rect x="2" y="0" width="26" height="6" rx="1" fill="url(#gold)"/>
    <rect x="2" y="22" width="22" height="6" rx="1" fill="url(#gold)"/>
    <rect x="2" y="46" width="26" height="6" rx="1" fill="url(#gold)"/>
    <!-- Accent on E -->
    <rect x="6" y="-6" width="10" height="3" rx="1" fill="url(#gold)" transform="rotate(-15 11 -4.5)"/>
  </g>
  <!-- EMAT -->
  <text x="42" y="34" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold)" letter-spacing="2">EMAT</text>
  <!-- SCENTS -->
  <text x="42" y="56" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="500" fill="#C0A050" letter-spacing="6">SCENTS</text>
  <!-- Tagline -->
  <text x="42" y="72" font-family="'Inter', Arial, sans-serif" font-size="7" font-weight="500" fill="#888" letter-spacing="1.5">STAND OUT FROM THE CROWD</text>
</svg>