<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldIzil" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8D5A3"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </linearGradient>
  </defs>
  <!-- Outer square frame -->
  <rect x="10" y="10" width="180" height="180" rx="2" stroke="url(#goldIzil)" stroke-width="2.5" fill="none"/>
  <!-- Inner square frame -->
  <rect x="18" y="18" width="164" height="164" rx="1" stroke="url(#goldIzil)" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- IZIL -->
  <text x="100" y="58" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="url(#goldIzil)" letter-spacing="6">IZIL</text>
  
  <!-- Decorative diamond pattern -->
  <g transform="translate(100, 95)" stroke="url(#goldIzil)" stroke-width="1.2" fill="none">
    <path d="M0,-18 L18,0 L0,18 L-18,0 Z"/>
    <path d="M0,-12 L12,0 L0,12 L-12,0 Z"/>
    <path d="M0,-6 L6,0 L0,6 L-6,0 Z"/>
    <circle cx="0" cy="0" r="2" fill="url(#goldIzil)" stroke="none"/>
  </g>
  
  <!-- PARFUMS -->
  <text x="100" y="140" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#C9A96E" letter-spacing="4">PARFUMS</text>
  
  <!-- Arabic: عطور إزيل -->
  <text x="100" y="172" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Arial', serif" font-size="18" font-weight="500" fill="url(#goldIzil)">عطور إزيل</text>
</svg>